name: Test Story Insights

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-test-insights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch final Story insights
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          META_API_VERSION: ${{ vars.META_API_VERSION || 'v24.0' }}
        run: python test_insights.py --test-id "FLOOD-STORY-TEST-20260814-FINAL" --media-id "18012974456941125"
      - name: Persist raw insight response
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/test_insights_raw.json
          git diff --cached --quiet || git commit -m "Record final Story insight test"
          git pull --rebase origin main
          git push origin HEAD:main
