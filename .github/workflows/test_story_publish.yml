name: Test Story Publish

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-test:
    runs-on: ubuntu-latest
    concurrency:
      group: instagram-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Publish supplied Story image directly
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          META_API_VERSION: ${{ vars.META_API_VERSION || 'v24.0' }}
        run: python test_publish.py --test-id "FLOOD-STORY-TEST-20260814-FINAL" --media-url "https://raw.githubusercontent.com/c2081540-commits/car-instagram-automation/main/media/test/story_flood_test.png"
      - name: Persist test Instagram media ID
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/test_history.json
          git diff --cached --quiet || git commit -m "Record final Story test publish"
          git pull --rebase origin main
          git push origin HEAD:main
