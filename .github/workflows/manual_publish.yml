name: Manual Story Publish

on:
  workflow_dispatch:
    inputs:
      content_id:
        description: "content_id from data/queue.json"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: instagram-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Publish selected Story
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          META_API_VERSION: ${{ vars.META_API_VERSION || 'v24.0' }}
        run: python publish.py --content-id "${{ inputs.content_id }}"
      - name: Persist queue and history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/queue.json data/history.json
          git diff --cached --quiet || git commit -m "Record Instagram Story publish"
          git push
